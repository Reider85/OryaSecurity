            events, then scanner events: `scanner_blocked` (mid-stream violation — stream terminates),
            `stream_complete` (end of stream). Upstream failures emit `scanner_error` before `stream_complete`.'
          content:
            application/json:
              schema: {}
            text/event-stream:
              schema:
                type: string
              examples:
                chunk:
                  summary: Normal chunk
                  value: 'data: {"id":"chatcmpl-abc123","object":"chat.completion.chunk","created":1767225600,"model":"gpt-4o-mini","choices":[{"index":0,"delta":{"content":"Hello"},"finish_reason":null}]}


                    '
                blocked:
                  summary: Mid-stream block
                  value: 'data: {"type":"scanner_blocked","reason":"PII: US SSN detected","rule_ids":["pii_ssn_us"]}


                    data: {"type":"stream_complete"}


                    '
                complete:
                  summary: Clean finish
                  value: 'data: {"type":"stream_complete"}


                    '
