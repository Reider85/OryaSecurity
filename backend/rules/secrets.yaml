rules:
  - id: secret_aws_key
    name: "AWS Access Key"
    type: regex
    pattern: '\bAKIA[0-9A-Z]{16}\b'
    severity: critical
    action: block
    version: "1.0.0"
  - id: secret_jwt
    name: "JSON Web Token"
    type: regex
    pattern: '\beyJ[a-zA-Z0-9_-]+\.eyJ[a-zA-Z0-9_-]+\.[a-zA-Z0-9_-]+\b'
    severity: high
    action: block
    version: "1.0.0"
  - id: secret_credit_card
    name: "Credit Card Number"
    type: regex
    pattern: '\b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14}|3[47][0-9]{13})\b'
    severity: critical
    action: block
    version: "1.0.0"