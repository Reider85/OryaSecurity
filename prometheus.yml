global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

# EP-15/Prompt 44: ship firing alerts to Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: scanner
    metrics_path: /metrics
    static_configs:
      - targets: ["scanner:8000"]
        labels:
          service: llm-security-scanner