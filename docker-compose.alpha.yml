name: llm-security-scanner-alpha

services:
  # Existing MVP stack (included via reference)
  # postgres, redis, scanner, ui, prometheus, grafana — defined in docker-compose.yml

  # Triton Inference Server (EP-08/Prompt 7)
  triton:
    image: nvcr.io/nvidia/tritonserver:24.01-py3
    restart: unless-stopped
    command: tritonserver --model-repository=/models --strict-model-config=false
    volumes:
      - ./ml-models:/models:ro
    environment:
      # Optional: for GPU, uncomment device reservation below
      # NVIDIA_VISIBLE_DEVICES: all
    ports:
      # HTTP (health, metrics) — avoid clash with scanner:8000
      - "8005:8000"
      # gRPC (inference) — scanner will use this
      - "8006:8001"
      # Metrics port (optional, for monitoring)
      - "8007:8002"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v2/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # GPU device reservation (CPU by default for dev)
    # For GPU: uncomment the deploy section below and remove the "kind: CPU" from ml-models/embeddings/config.pbtxt
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Qdrant Vector DB (EP-09/Prompt 11) — 3-node cluster (RF=2)
  qdrant1:
    image: qdrant/qdrant:v1.12.0
    restart: unless-stopped
    volumes:
      - qdrant1_data:/qdrant/storage
    ports:
      - "6333:6333"  # HTTP API (exposed for external access)
    environment:
      - QDRANT__CLUSTER__ENABLED=true
      - QDRANT__CLUSTER__PEERS=qdrant1:6333,qdrant2:6333,qdrant3:6333
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  qdrant2:
    image: qdrant/qdrant:v1.12.0
    restart: unless-stopped
    volumes:
      - qdrant2_data:/qdrant/storage
    ports:
      # HTTP API on loopback only — needed for per-node snapshots (qdrant_backup.sh)
      - "127.0.0.1:6343:6333"
    environment:
      - QDRANT__CLUSTER__ENABLED=true
      - QDRANT__CLUSTER__PEERS=qdrant1:6333,qdrant2:6333,qdrant3:6333
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  qdrant3:
    image: qdrant/qdrant:v1.12.0
    restart: unless-stopped
    volumes:
      - qdrant3_data:/qdrant/storage
    ports:
      # HTTP API on loopback only — needed for per-node snapshots (qdrant_backup.sh)
      - "127.0.0.1:6353:6333"
    environment:
      - QDRANT__CLUSTER__ENABLED=true
      - QDRANT__CLUSTER__PEERS=qdrant1:6333,qdrant2:6333,qdrant3:6333
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Qdrant single-node (dev mode) — run with: docker compose --profile dev up qdrant
  qdrant:
    image: qdrant/qdrant:v1.12.0
    restart: unless-stopped
    volumes:
      - qdrant_dev_data:/qdrant/storage
    profiles: ["dev"]
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # MinIO — S3-compatible storage for Qdrant snapshots (EP-09/Prompt 15)
  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"  # S3 API (used by backend/scripts/qdrant_backup.sh)
      - "9001:9001"  # Web console
    # No healthcheck: the image ships neither curl nor nc.
    # Readiness is handled by minio-init (mc alias set retry loop).

  # Creates the backup bucket on start (idempotent, exits 0)
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: on-failure
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-qdrant-backups}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; do sleep 2; done;
      mc mb --ignore-existing \"local/$$S3_BUCKET\";
      echo \"[minio-init] bucket $$S3_BUCKET ready\";
      "

  # OPA Policy Decision Point (EP-12/Prompt 25 + 28)
  # Polls bundle-service for versioned bundles every 30s; atomic switch on
  # new bundle activation (no request interruption).
  opa:
    image: openpolicyagent/opa:0.68.0
    restart: unless-stopped
    command: >
      run --server
      --addr=0.0.0.0:8181
      --set=services.default.url=http://bundle-service:8081
      --set=bundles.scanner.service=default
      --set=bundles.scanner.resource=bundles/bundle.tar.gz
      --set=bundles.scanner.polling.min_delay_seconds=30
      --set=bundles.scanner.polling.max_delay_seconds=30
      --set=bundles.scanner.save_bundle_checksum=true
    ports:
      - "8181:8181"
    depends_on:
      bundle-service:
        condition: service_started
    # No healthcheck: the OPA image is scratch-based (no shell/wget).
    # Readiness is checked by the scanner's OPA client (fail-open on startup).

  # Static file server for policy bundles (docroot: policies/bundles/)
  # Serves: /bundles/bundle.tar.gz, /bundles/manifest.json (+ .sig/.cert)
  bundle-service:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./policies/bundles:/usr/share/nginx/html/bundles:ro
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # HashiCorp Vault — HA cluster, 3 nodes with Raft consensus
  # (EP-13/Prompt 31, ADR-0007; ALPHA exit checklist: "Vault HA mode (3 nodes, Raft)").
  #
  # Fresh cluster lifecycle (idempotent script):
  #   bash backend/scripts/vault_init.sh
  #   1. init node1 (Shamir 5/3), save keys to backend/scripts/.vault-secrets/
  #   2. unseal all 3 nodes (raft retry_join wires the cluster automatically)
  #   3. enable tokenization engine, or transit (OSS fallback, convergent)
  #
  # Until vault_init.sh runs, nodes are sealed — healthcheck is TCP-level only
  # (HTTP /v1/sys/health returns 501/503 before init/unseal).
  vault1:
    image: hashicorp/vault:1.18.0
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_LOCAL_CONFIG: |
        storage "raft" {
          path    = "/vault/data"
          node_id = "vault1"
          retry_join {
            leader_api_addr = "http://vault1:8200"
          }
          retry_join {
            leader_api_addr = "http://vault2:8200"
          }
          retry_join {
            leader_api_addr = "http://vault3:8200"
          }
        }
        listener "tcp" {
          address     = "0.0.0.0:8200"
          tls_disable = true
        }
        api_addr     = "http://vault1:8200"
        cluster_addr = "http://vault1:8201"
        disable_mlock = true
        ui = true
    ports:
      - "8200:8200"  # HTTP API (used by scanner + vault_init.sh)
    volumes:
      - vault1_data:/vault/data
    healthcheck:
      # TCP only: HTTP /v1/sys/health is non-200 until the node is
      # initialized and unsealed (501 / 503 / 429-standby).
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/8200' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  vault2:
    image: hashicorp/vault:1.18.0
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_LOCAL_CONFIG: |
        storage "raft" {
          path    = "/vault/data"
          node_id = "vault2"
          retry_join {
            leader_api_addr = "http://vault1:8200"
          }
          retry_join {
            leader_api_addr = "http://vault2:8200"
          }
          retry_join {
            leader_api_addr = "http://vault3:8200"
          }
        }
        listener "tcp" {
          address     = "0.0.0.0:8200"
          tls_disable = true
        }
        api_addr     = "http://vault2:8200"
        cluster_addr = "http://vault2:8201"
        disable_mlock = true
        ui = true
    ports:
      # HTTP API on loopback only — needed for vault_init.sh (per-node unseal)
      - "127.0.0.1:8210:8200"
    volumes:
      - vault2_data:/vault/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/8200' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  vault3:
    image: hashicorp/vault:1.18.0
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_LOCAL_CONFIG: |
        storage "raft" {
          path    = "/vault/data"
          node_id = "vault3"
          retry_join {
            leader_api_addr = "http://vault1:8200"
          }
          retry_join {
            leader_api_addr = "http://vault2:8200"
          }
          retry_join {
            leader_api_addr = "http://vault3:8200"
          }
        }
        listener "tcp" {
          address     = "0.0.0.0:8200"
          tls_disable = true
        }
        api_addr     = "http://vault3:8200"
        cluster_addr = "http://vault3:8201"
        disable_mlock = true
        ui = true
    ports:
      # HTTP API on loopback only — needed for vault_init.sh (per-node unseal)
      - "127.0.0.1:8220:8200"
    volumes:
      - vault3_data:/vault/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/8200' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Vault single-node (dev mode) — run with: docker compose --profile dev up vault
  # Auto-initialized + unsealed; root token from VAULT_DEV_ROOT_TOKEN.
  # Data is ephemeral — for local development and tests only.
  vault:
    image: hashicorp/vault:1.18.0
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    command: server -dev
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-dev-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    profiles: ["dev"]
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/8200' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # Override scanner service to use Qdrant cluster + OPA PDP + Vault PII redaction
  scanner:
    environment:
      SCANNER_QDRANT_URL: http://qdrant1:6333
      SCANNER_OPA_URL: http://opa:8181
      SCANNER_BUNDLE_SERVICE_URL: http://bundle-service:8081
      SCANNER_PDP_OPA_ENABLED: "true"
      SCANNER_VAULT_URL: http://vault1:8200
      # Root token produced by backend/scripts/vault_init.sh (backend/scripts/.vault-secrets/).
      # Empty => Vault client stays initialized-but-tokenless; encode/decode fail
      # through the circuit breaker (redaction fails closed downstream).
      SCANNER_VAULT_TOKEN: ${VAULT_TOKEN:-}
      # OpenTelemetry (EP-15/Prompt 41): point OTLP to collector
      SCANNER_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      # EP-15/Prompt 42: PII redaction in structured logs
      SCANNER_LOG_REDACTION_ENABLED: ${LOG_REDACTION_ENABLED:-true}
    depends_on:
      qdrant1:
        condition: service_started
      opa:
        condition: service_started
      vault1:
        condition: service_started

  # Token TTL / auto-cleanup job (EP-13/Prompt 34, ADR-0007): rotates the
  # Vault encode key every ${VAULT_TOKEN_TTL_SECONDS:-300}s and retires older
  # key versions via min_decryption_version, so minted PII tokens expire
  # after (ttl, 2*ttl]. Same image as the scanner; the entrypoint is
  # overridden because entrypoint.sh unconditionally starts uvicorn.
  # Manual/one-shot run: docker compose -f docker-compose.yml -f
  # docker-compose.alpha.yml run --rm vault-cleanup scripts/vault_cleanup.py --once
  vault-cleanup:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["/app/.venv/bin/python"]
    command: ["scripts/vault_cleanup.py", "--loop"]
    environment:
      SCANNER_VAULT_URL: http://vault1:8200
      # Root token from backend/scripts/vault_init.sh (see scanner above).
      SCANNER_VAULT_TOKEN: ${VAULT_TOKEN:-}
      SCANNER_VAULT_MOUNT: ${VAULT_MOUNT:-tokenization}
      SCANNER_VAULT_KEY_NAME: ${VAULT_KEY_NAME:-default}
      SCANNER_VAULT_TOKEN_TTL_SECONDS: ${VAULT_TOKEN_TTL_SECONDS:-300}
      SCANNER_VAULT_TOKEN_TTL_GRACE_VERSIONS: ${VAULT_TOKEN_TTL_GRACE_VERSIONS:-1}
    depends_on:
      vault1:
        condition: service_started

  # EP-15/Prompt 41: Jaeger + trace sampling
  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: true
    ports:
      - "16686:16686"  # UI
    volumes:
      - jaeger_data:/jaeger-query/storage

  # EP-15/Prompt 41: OTel Collector with tail sampling
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/config.yaml
    ports:
      - "4317:4317"  # OTLP gRPC
    depends_on:
      - jaeger

  # EP-15/Prompt 42: Loki structured logs
  loki:
    image: grafana/loki:3.2.0
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - loki_data:/loki
      - ./observability/loki.yml:/etc/loki/loki.yml:ro
    ports:
      - "3100:3100"

  # EP-15/Prompt 42: Promtail log collector
  promtail:
    image: grafana/promtail:3.2.0
    restart: unless-stopped
    volumes:
      - ./observability/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/positions
    depends_on:
      - loki
    ports:
      - "9080:9080"

  # EP-15/Prompt 44: Alertmanager (ADR-0015)
  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/config.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/config.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"

volumes:
  # Reuse volumes from docker-compose.yml
  pg_data:
  redis_data:
  grafana_data:
  # New volumes for ALPHA services
  qdrant1_data:
  qdrant2_data:
  qdrant3_data:
  qdrant_dev_data:
  minio_data:
  vault1_data:
  vault2_data:
  vault3_data:
  # EP-15/Prompt 42: Loki & Promtail volumes
  loki_data:
  promtail_positions:
  # EP-15/Prompt 44: Alertmanager alert storage
  alertmanager_data: