# EP-15/Prompt 43: dashboard provider config
#
# Docker-compose mounts ./observability/grafana/dashboards into
# /var/lib/grafana/dashboards (see docker-compose.yml, grafana service),
# so options.path must point there — the provider picks up all *.json
# dashboards (scanner, circuit_breakers, scanner_operational) on startup
# and re-scans them every updateIntervalSeconds.

apiVersion: 1

providers:
  - name: 'default'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards