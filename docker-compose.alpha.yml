name: llm-security-scanner-alpha

services:
  # Existing MVP stack (included via reference)
  # postgres, redis, scanner, ui, prometheus, grafana — defined in docker-compose.yml

  # Triton Inference Server (EP-08/Prompt 7)
  triton:
    image: nvcr.io/nvidia/tritonserver:24.01-py3
    restart: unless-stopped
    command: tritonserver --model-repository=/models --strict-model-config=false
    volumes:
      - ./ml-models:/models:ro
    environment:
      # Optional: for GPU, uncomment device reservation below
      # NVIDIA_VISIBLE_DEVICES: all
    ports:
      # HTTP (health, metrics) — avoid clash with scanner:8000
      - "8005:8000"
      # gRPC (inference) — scanner will use this
      - "8006:8001"
      # Metrics port (optional, for monitoring)
      - "8007:8002"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v2/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # GPU device reservation (CPU by default for dev)
    # For GPU: uncomment the deploy section below and remove the "kind: CPU" from ml-models/embeddings/config.pbtxt
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Qdrant Vector DB (EP-09/Prompt 11) — 3-node cluster (RF=2)
  qdrant1:
    image: qdrant/qdrant:v1.12.0
    restart: unless-stopped
    volumes:
      - qdrant1_data:/qdrant/storage
    ports:
      - "6333:6333"  # HTTP API (exposed for external access)
    environment:
      - QDRANT__CLUSTER__ENABLED=true
      - QDRANT__CLUSTER__PEERS=qdrant1:6333,qdrant2:6333,qdrant3:6333
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  qdrant2:
    image: qdrant/qdrant:v1.12.0
    restart: unless-stopped
    volumes:
      - qdrant2_data:/qdrant/storage
    ports:
      # HTTP API on loopback only — needed for per-node snapshots (qdrant_backup.sh)
      - "127.0.0.1:6343:6333"
    environment:
      - QDRANT__CLUSTER__ENABLED=true
      - QDRANT__CLUSTER__PEERS=qdrant1:6333,qdrant2:6333,qdrant3:6333
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  qdrant3:
    image: qdrant/qdrant:v1.12.0
    restart: unless-stopped
    volumes:
      - qdrant3_data:/qdrant/storage
    ports:
      # HTTP API on loopback only — needed for per-node snapshots (qdrant_backup.sh)
      - "127.0.0.1:6353:6333"
    environment:
      - QDRANT__CLUSTER__ENABLED=true
      - QDRANT__CLUSTER__PEERS=qdrant1:6333,qdrant2:6333,qdrant3:6333
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Qdrant single-node (dev mode) — run with: docker compose --profile dev up qdrant
  qdrant:
    image: qdrant/qdrant:v1.12.0
    restart: unless-stopped
    volumes:
      - qdrant_dev_data:/qdrant/storage
    profiles: ["dev"]
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # MinIO — S3-compatible storage for Qdrant snapshots (EP-09/Prompt 15)
  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"  # S3 API (used by backend/scripts/qdrant_backup.sh)
      - "9001:9001"  # Web console
    # No healthcheck: the image ships neither curl nor nc.
    # Readiness is handled by minio-init (mc alias set retry loop).

  # Creates the backup bucket on start (idempotent, exits 0)
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: on-failure
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-qdrant-backups}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; do sleep 2; done;
      mc mb --ignore-existing \"local/$$S3_BUCKET\";
      echo \"[minio-init] bucket $$S3_BUCKET ready\";
      "

  # OPA Policy Decision Point (EP-12/Prompt 25 + 28)
  # Polls bundle-service for versioned bundles every 30s; atomic switch on
  # new bundle activation (no request interruption).
  opa:
    image: openpolicyagent/opa:0.68.0
    restart: unless-stopped
    command: >
      run --server
      --addr=0.0.0.0:8181
      --set=services.default.url=http://bundle-service:8081
      --set=bundles.scanner.service=default
      --set=bundles.scanner.resource=bundles/bundle.tar.gz
      --set=bundles.scanner.polling.min_delay_seconds=30
      --set=bundles.scanner.polling.max_delay_seconds=30
      --set=bundles.scanner.save_bundle_checksum=true
    ports:
      - "8181:8181"
    depends_on:
      bundle-service:
        condition: service_started
    # No healthcheck: the OPA image is scratch-based (no shell/wget).
    # Readiness is checked by the scanner's OPA client (fail-open on startup).

  # Static file server for policy bundles (docroot: policies/bundles/)
  # Serves: /bundles/bundle.tar.gz, /bundles/manifest.json (+ .sig/.cert)
  bundle-service:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./policies/bundles:/usr/share/nginx/html/bundles:ro
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Override scanner service to use Qdrant cluster + OPA PDP
  scanner:
    environment:
      SCANNER_QDRANT_URL: http://qdrant1:6333
      SCANNER_OPA_URL: http://opa:8181
      SCANNER_BUNDLE_SERVICE_URL: http://bundle-service:8081
      SCANNER_PDP_OPA_ENABLED: "true"
    depends_on:
      qdrant1:
        condition: service_started
      opa:
        condition: service_started

  # Future ALPHA services will be added here:
  # vault (EP-13/Prompt 31)
  # jaeger, loki, alertmanager (EP-15/Prompts 41, 42, 44)

volumes:
  # Reuse volumes from docker-compose.yml
  pg_data:
  redis_data:
  grafana_data:
  # New volumes for ALPHA services
  qdrant1_data:
  qdrant2_data:
  qdrant3_data:
  qdrant_dev_data:
  minio_data:
  # vault_data: