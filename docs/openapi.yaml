    get:
      tags:
      - decisions
      summary: Get Decisions
      description: 'Retrieve decisions with enhanced data including latency breakdown and rule details.

        Returns recent decisions sorted by timestamp (newest first).'
      operationId: get_decisions_api_v1_decisions_get
      security:
      - ApiKeyAuth: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
