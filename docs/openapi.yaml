          default: 50
          title: Limit
        description: Maximum number of decisions to return
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number
          default: 1
          title: Page
        description: Page number
      - name: verdict
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(allow|block)$
          - type: 'null'
          description: Filter by verdict
          title: Verdict
        description: Filter by verdict
      - name: tenant_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by tenant ID
          title: Tenant Id
        description: Filter by tenant ID
      - name: rule_id
