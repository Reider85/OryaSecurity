  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      description: 'Exchange a scanner API key for a short-lived JWT (UI auth flow).


        Public endpoint (no Authorization header required). The raw API key is

        verified against the database; on success a JWT carrying the tenant_id

        claim is returned with a TTL from settings.jwt_ttl_seconds (default 24h).'
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
