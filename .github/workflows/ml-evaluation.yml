name: ML Evaluation

# Prompt 20 (EP-10): F1 regression gate on the locked hold-out test set.
# Fails the PR when the classifier's F1 macro regresses more than 5%
# against ml-models/classifier/v1/evaluation_baseline.json.

on:
  pull_request:
    paths:
      - "backend/app/ml/**"
      - "backend/ml-models/**"
      - "ml-models/**"
      - ".github/workflows/ml-evaluation.yml"
  workflow_dispatch:

concurrency:
  group: ml-evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Evaluate classifier (smoke-train + F1 gate)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Create venv
        run: uv venv .venv

      - name: Install CPU torch
        run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project (train + dev extras)
        run: uv pip install -e ".[train,dev]"

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bert-base-uncased-${{ runner.os }}-v1

      - name: Verify locked hold-out test set
        run: .venv/bin/python -m app.ml.build_test_set --check

      - name: Smoke-train classifier (seed 42, CPU)
        run: .venv/bin/python -m app.ml.train_classifier --smoke --min-f1 0

      - name: Evaluate + F1 regression gate
        run: >
          .venv/bin/python -m app.ml.evaluate
          --model ml-models/classifier/v1
          --test-set app/ml/datasets/test_v1.json
          --baseline ml-models/classifier/v1/evaluation_baseline.json
          --max-regression 0.05

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: |
            backend/ml-models/classifier/v1/evaluation_report.json
            backend/ml-models/classifier/v1/confusion_matrix.png
          if-no-files-found: warn
