# EP-35 / Prompt 46: Envoy frontend proxy с TLS termination (ADR-0001).
#
# Публичная точка входа стека ALPHA:
#   :80  -> 301 redirect на https://
#   :443 -> TLS termination (certs из ./certs, см. backend/scripts/gen_certs.sh)
#           /v1/, /v2/, /api/, /scan, /metrics, /health, /docs, /redoc, /openapi.json -> scanner:8000
#           /                                                    -> ui:3000
#
# Rate limit: 100 RPS per client IP (local_ratelimit + route descriptors remote_address).
# Access log: JSON в stdout -> Promtail (docker_sd, label app="envoy") -> Loki.
#   LogQL: {app="envoy"} | json
#          {app="envoy"} | json |= "response_code=\"429\""
#
# Streaming-safe: route timeout 0s на /v1/ и /v2/ (SSE, EP-07), HCM stream_idle_timeout 0s.
# Запуск валидации: docker run --rm -v ./observability/envoy.yaml:/etc/envoy/envoy.yaml:ro \
#   envoyproxy/envoy:v1.31-latest --mode validate -c /etc/envoy/envoy.yaml

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    # ------------------------------------------------------------------
    # :80 — HTTP -> HTTPS redirect
    # ------------------------------------------------------------------
    - name: http_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 80
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          ts: "%START_TIME%"
                          listener: "http_80"
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(:PATH)%"
                          authority: "%REQ(:AUTHORITY)%"
                          protocol: "%PROTOCOL%"
                          response_code: "%RESPONSE_CODE%"
                          response_flags: "%RESPONSE_FLAGS%"
                          duration_ms: "%DURATION%"
                          client_ip: "%DOWNSTREAM_REMOTE_ADDRESS%"
                route_config:
                  name: redirect_route
                  virtual_hosts:
                    - name: redirect
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          redirect:
                            https_redirect: true
                            scheme_redirect: true
                            port_redirect: 443
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # ------------------------------------------------------------------
    # :443 — TLS termination + routing + per-IP rate limit
    # ------------------------------------------------------------------
    - name: https_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 443
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_https
                codec_type: AUTO
                # SSE / long-lived streams (EP-07): не обрывать проксируемые ответы.
                stream_idle_timeout: 0s
                common_http_protocol_options:
                  idle_timeout: 3600s
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          ts: "%START_TIME%"
                          listener: "https_443"
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(:PATH)%"
                          authority: "%REQ(:AUTHORITY)%"
                          protocol: "%PROTOCOL%"
                          response_code: "%RESPONSE_CODE%"
                          response_flags: "%RESPONSE_FLAGS%"
                          bytes_received: "%BYTES_RECEIVED%"
                          bytes_sent: "%BYTES_SENT%"
                          duration_ms: "%DURATION%"
                          client_ip: "%DOWNSTREAM_REMOTE_ADDRESS%"
                          upstream_cluster: "%UPSTREAM_CLUSTER%"
                          upstream_service: "%UPSTREAM_HOST%"
                          request_id: "%REQ(X-REQUEST-ID)%"
                          user_agent: "%REQ(USER-AGENT)%"
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: app
                      domains: ["*"]
                      routes:
                        # --- scanner: OpenAI-compat + streaming (timeout 0s для SSE) ---
                        - match:
                            prefix: "/v1/"
                          route:
                            cluster: scanner
                            timeout: 0s
                          rate_limits:
                            - actions:
                                - remote_address: {}
                        - match:
                            prefix: "/v2/"
                          route:
                            cluster: scanner
                            timeout: 0s
                          rate_limits:
                            - actions:
                                - remote_address: {}
                        # --- scanner: UI API, scan, observability, docs ---
                        - match:
                            prefix: "/api/"
                          route:
                            cluster: scanner
                            timeout: 30s
                          rate_limits:
                            - actions:
                                - remote_address: {}
                        - match:
                            path: "/scan"
                          route:
                            cluster: scanner
                            timeout: 30s
                          rate_limits:
                            - actions:
                                - remote_address: {}
                        - match:
                            path: "/metrics"
                          route:
                            cluster: scanner
                            timeout: 10s
                          rate_limits:
                            - actions:
                                - remote_address: {}
                        - match:
                            path: "/health"
                          route:
                            cluster: scanner
                            timeout: 5s
                          rate_limits:
                            - actions:
                                - remote_address: {}
                        - match:
                            path: "/docs"
                          route:
                            cluster: scanner
                            timeout: 10s
                          rate_limits:
                            - actions:
                                - remote_address: {}
                        - match:
                            path: "/redoc"
                          route:
                            cluster: scanner
                            timeout: 10s
                          rate_limits:
                            - actions:
                                - remote_address: {}
                        - match:
                            path: "/openapi.json"
                          route:
                            cluster: scanner
                            timeout: 10s
                          rate_limits:
                            - actions:
                                - remote_address: {}
                        # --- UI (Next.js) ---
                        - match:
                            prefix: "/"
                          route:
                            cluster: ui
                            timeout: 30s
                          rate_limits:
                            - actions:
                                - remote_address: {}
                http_filters:
                  # EP-35: 100 RPS per client IP (descriptor remote_address).
                  # Глобальный bucket — страховка от переполнения памяти фильтра.
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: http_local_rate_limiter
                      token_bucket:
                        max_tokens: 10000
                        tokens_per_fill: 10000
                        fill_interval: 1s
                      descriptors:
                        - entries:
                            - key: remote_address
                          token_bucket:
                            max_tokens: 100
                            tokens_per_fill: 100
                            fill_interval: 1s
                      filter_enabled:
                        runtime_key: local_rate_limit_enabled
                        default_value:
                          numerator: 100
                          denominator: HUNDRED
                      filter_enforced:
                        runtime_key: local_rate_limit_enforced
                        default_value:
                          numerator: 100
                          denominator: HUNDRED
                      response_headers_to_add:
                        - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          header:
                            key: x-local-rate-limit
                            value: "true"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                alpn_protocols: ["h2", "http/1.1"]
                tls_certificates:
                  - certificate_chain:
                      filename: /etc/ssl/scanner.crt
                    private_key:
                      filename: /etc/ssl/scanner.key

  clusters:
    - name: scanner
      type: STRICT_DNS
      connect_timeout: 0.25s
      lb_policy: ROUND_ROBIN
      health_checks:
        - timeout: 2s
          interval: 30s
          unhealthy_threshold: 3
          healthy_threshold: 1
          http_health_check:
            path: /health
      load_assignment:
        cluster_name: scanner
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: scanner
                      port_value: 8000

    - name: ui
      type: STRICT_DNS
      connect_timeout: 0.25s
      lb_policy: ROUND_ROBIN
      health_checks:
        - timeout: 2s
          interval: 30s
          unhealthy_threshold: 3
          healthy_threshold: 1
          http_health_check:
            path: /
      load_assignment:
        cluster_name: ui
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: ui
                      port_value: 3000
