[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-security-scanner"
version = "0.1.0"
description = "LLM Security Scanner — inline security proxy between AI apps and LLM providers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    "bcrypt>=4.2.0",
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "redis[hiredis]>=5.2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.20.0",
    "watchdog>=4.0.0",
    "prometheus-client>=0.21.0",
    "pyjwt>=2.15.1",
    "onnxruntime>=1.19.0",
    "numpy>=1.26.0",
    "transformers>=4.46.0",
    "qdrant-client>=1.12.0",
    "tritonclient[grpc]>=2.41.0",
    "shap>=0.46.0",
]

[project.optional-dependencies]
export = [
    "torch>=2.4.0",
    "optimum[onnxruntime]>=1.24.0,<3.0.0",
    "onnx>=1.17.0",
]
train = [
    "torch>=2.4.0",
    "accelerate>=1.0.0",
    "scikit-learn>=1.5.0",
    "sentencepiece>=0.2.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "datasets>=2.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "fakeredis[lua]>=2.25.0",
    "testcontainers[postgres,redis]>=4.9.0",
    "opa-python>=0.0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=90"
# Session-scoped async fixtures (the Postgres pool/engine live in
# app.db.session module globals) must be created on the same event loop the
# tests run on, otherwise asyncpg fails with "Event loop is closed".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: end-to-end tests running against real dependencies",
    "db: requires a reachable PostgreSQL",
    "redis: requires a reachable Redis (or fakeredis fallback)",
    "qdrant: requires a reachable Qdrant",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "opa-python>=0.0.9",
]
