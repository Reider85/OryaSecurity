  /v2/chat/completions:
    post:
      tags:
      - v2
      - streaming
      summary: OpenAI-compatible Chat Completions streaming endpoint
      description: 'Forwards an OpenAI Chat Completions request (`stream: true`) to the configured LLM
        provider and inspects every chunk as it flows back:


        - **Prompt inspection** runs before the upstream call (rules + OPA PDP + cache).

        - **Per-chunk inspection** (regex + lightweight toxicity) can terminate the stream mid-flight
        with a `scanner_blocked` event.

        - **PII redaction** tokenizes secrets before forwarding; echoed tokens are detokenized just before
        the client sees them (fail-closed when Vault is down).

        - **Post-factum deep analysis** (embedding/vector/ML) runs in the background after `stream_complete`
        and never retracts shown content.


        Responses are `text/event-stream`; rate-limit headers (`X-RateLimit-Limit`, `X-RateLimit-Remaining`)
        and `X-Rate-Id` are set on every response.'
