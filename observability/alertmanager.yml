# Alertmanager configuration template (EP-15/Prompt 44, ADR-0015).
# Mounted into alertmanager container at /etc/alertmanager/alertmanager.yml.tmpl.
#
# Routing: Critical -> PagerDuty, Warning -> Slack #scanner-alerts.
# NOTE: Environment variables (${PAGERDUTY_SERVICE_KEY}, ${SLACK_WEBHOOK_URL})
# are rendered by entrypoint.sh into /tmp/alertmanager.yml at runtime.
# Empty values use dev placeholders; compose env provides defaults.

global:
  resolve_timeout: 5m

route:
  receiver: slack
  group_by: ['alertname', 'component']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Critical -> PagerDuty
    - matchers:
        - severity = "critical"
      receiver: pagerduty
      continue: false
    # Warning -> Slack #scanner-alerts
    - matchers:
        - severity = "warning"
      receiver: slack
      continue: false

# A critical alert silences the matching warning of the same alert/component.
inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ['alertname', 'component']

receivers:
  # Rendered by entrypoint.sh: service_key = ${PAGERDUTY_SERVICE_KEY}
  - name: pagerduty
    pagerduty_configs:
      - service_key: "${PAGERDUTY_SERVICE_KEY}"
        severity: critical
        description: '{{ .CommonAnnotations.summary }}'

  # Rendered by entrypoint.sh: api_url = ${SLACK_WEBHOOK_URL}
  - name: slack
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: '#scanner-alerts'
        title: '{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
        text: '{{ .CommonAnnotations.summary }}'
